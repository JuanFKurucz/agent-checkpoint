[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-checkpoint"
version = "0.1.9"
description = "Local task contracts and snapshot-bound evidence for coding agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3", "mcp==2.2.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
agent-checkpoint = "agent_checkpoint.cli:main"

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-socket>=0.7", "ruff>=0.9", "mypy>=1.15", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_checkpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-socket"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/agent_checkpoint"]
